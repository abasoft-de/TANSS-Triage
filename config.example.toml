# Vorlage für config.toml - Verhalten von TANSS-Triage.
#
# Einrichten:  cp config.example.toml config.toml
# Secrets (Zugangsdaten, API-Keys) gehören NICHT hierher, sondern in .env.
# Jeder Wert hier zeigt den eingebauten Default - wer nichts ändern will,
# kann den Eintrag auch weglassen.

[polling]
# Wie oft die TANSS-Datenbank nach neuen Sprachaufnahmen gefragt wird
# (neue Mail-Anhänge und Ticket-Dokumente, über persistierte ID-Cursor -
# ein Neustart holt verpasste Zeit automatisch nach).
interval_seconds = 60
# Rückblick beim allerersten Start, wenn noch kein Cursor gespeichert ist.
initial_lookback_minutes = 60

[audio]
# Dateiendungen, die als Sprachaufnahme gelten (zusätzlich zählt jeder
# Anhang mit MIME-Typ audio/*).
extensions = ["wav", "mp3", "m4a", "ogg", "opus", "flac", "aac", "wma"]

[whisper]
# Modellname von faster-whisper (tiny, base, small, medium, large-v3, ...).
# large-v3 lädt beim ersten Start ca. 3 GB in den Modellcache.
model = "large-v3"
device = "auto"          # auto | cpu | cuda
compute_type = "int8"    # int8 ist der CPU-Kompromiss aus Tempo und Qualität
language = "de"
# Modellcache; leer = Hugging-Face-Default (~/.cache/huggingface).
download_root = ""

[llm]
# anthropic | openai_compatible | none
# Leer = Automatik: "anthropic", wenn ANTHROPIC_API_KEY gesetzt ist,
# sonst "none" (dann gibt es nur Transkript-Kommentar und Rufnummern-
# Zuordnung, kein Betreff/Beschreibung-Rewrite).
provider = ""
model = "claude-sonnet-5"
# Nur für openai_compatible: Basis-URL des Endpunkts,
# z. B. "http://localhost:11434/v1" für Ollama.
base_url = ""
max_tokens = 1500
timeout = 120
# Zusätzliche Hausabkürzungen, die das LLM im Betreff verwenden soll (die
# eingebaute Liste - EVA, KIM, ePA, eRP, KT, HZV, PAL, RR ... - steht in
# src/tanss_triage/triage.py und bleibt erhalten; hier kommt nur dazu, was
# neu ist). Whisper schreibt aus, was gesprochen wird; der Betreff soll das
# Kürzel tragen, das die Hotline auch von Hand notiert.
subject_abbreviations_extra = []   # z. B. ["Hybrid-DRG", "eAB", "DMP"]

[starface]
# Eingehende Mails dieser Absender machen ein Ticket zum Starface-Ticket
# (Teilstring-Vergleich, Groß-/Kleinschreibung egal).
sender_patterns = ["starface@tele-x.abasoft-gmbh.de"]
# Betreff wird nur überschrieben, solange er noch auf dieses Muster passt -
# von Kolleg*innen angepasste Betreffe bleiben unangetastet.
generic_title_pattern = "^Sie haben eine Sprachnachricht"
# Beschreibung wird nur ersetzt, solange noch einer dieser Teilstrings
# darin vorkommt (Starface-Boilerplate).
generic_content_patterns = ["WARNUNG: EXTERNE NACHRICHT", "STARFACE"]

[assignment]
# Rufnummern-Zuordnung von Starface-Tickets (Firma, ggf. Melder).
enabled = true
assign_remitter = true

[departments]
# Abteilung, bei der jedes Starface-Ticket landet (auch ohne LLM). Gesetzt
# wird nur, solange das Ticket noch keiner Abteilung zugewiesen ist.
enabled = true
id = 8                            # mitarbeiter_abteilung.ID der HLE
name = "HLE"                      # nur fürs Log

[outage]
# Praxisausfall (Server weg, Praxis kann nicht arbeiten - erkennt das LLM):
# Betreff mit Präfix, Fälligkeit und Deadline sofort, Tag DRINGEND. Der
# API-Benutzer braucht dafür die Rechte "Ticket-System: Fälligkeit
# bearbeiten" und "Ticket-System: Deadline bearbeiten".
enabled = true
title_prefix = "SERVERAUSFALL !! "
tag_id = 53                       # tag.id von "DRINGEND"; 0 = kein Tag
tag_name = "DRINGEND"             # nur fürs Log

[db]
# Read-only-Zugriff auf die TANSS-MariaDB für den Mehrfach-Firmen-Check
# (mitarbeiter_firmen) - dieselbe Zugangsdatei wie der MCP-Server.
# Leer lassen, um den Check abzuschalten (dann werden Mitarbeiter-Treffer
# sicherheitshalber NICHT zugeordnet).
defaults_file = "~/.my.cnf"
host = "localhost"
database = "tanss"

[storage]
# Ablage der Mail-Anhänge auf dem TANSS-Server. Starface hängt die Voicemail
# an die MAIL (nicht ans Ticket); die Dateien liegen als
# <verzeichnis>/<filenameDB> unter diesem Pfad und werden direkt gelesen.
# Leer = nur den API-Weg versuchen.
mail_attachments_dir = "~/app/storage/dokumente/attachments"

[comment]
# Transkript-Kommentare als "intern" anlegen (Kunden sehen sie nicht).
internal = true

[state]
# SQLite-Datei mit den bereits verarbeiteten Dokumenten.
db_path = "state.db"

[logging]
level = "INFO"
# Leer = nur Konsole (unter systemd landet das im Journal).
file = ""
