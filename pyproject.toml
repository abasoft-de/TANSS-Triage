[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tanss-triage"
version = "0.7.0"
description = "Transkribiert Sprachnachrichten aus TANSS-Tickets (lokales Whisper) und bereitet Starface-Tickets per LLM auf"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "abasoft GmbH" }]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "faster-whisper>=1.1",
    "pymysql>=1.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tanss-triage = "tanss_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
